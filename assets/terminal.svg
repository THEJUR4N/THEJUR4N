
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="1" y="1" width="898" height="298" rx="15"/>
    </clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect x="1" y="1" width="898" height="298" rx="15" stroke="#263746" stroke-width="2"/>
    <path d="M0 48H900" stroke="#263746"/>
    <circle cx="24" cy="24" r="5" fill="#FF5F57"/>
    <circle cx="44" cy="24" r="5" fill="#FEBC2E"/>
    <circle cx="64" cy="24" r="5" fill="#28C840"/>
    <text x="450" y="29" text-anchor="middle" fill="#8295A8" font-family="monospace" font-size="12">THEJUR4N — developer terminal</text>
    <g font-family="monospace" font-size="18">
      <text x="28" y="83" fill="#00D9FF">visitor@thejur4n:~$</text>
      <text x="265" y="83" fill="#FFFFFF">whoami</text>
      <text x="28" y="117" fill="#B8C7D9">Software developer in progress.</text>
      <text x="28" y="157" fill="#00D9FF">visitor@thejur4n:~$</text>
      <text x="265" y="157" fill="#FFFFFF">cat mission.txt</text>
      <text x="28" y="191" fill="#B8C7D9">Building with software, data &amp; AI.</text>
      <text x="28" y="231" fill="#00D9FF">visitor@thejur4n:~$</text>
      <text x="265" y="231" fill="#FFFFFF">echo "Keep building"</text>
      <text x="28" y="265" fill="#00D9FF">~$</text>
      <rect x="59" y="248" width="11" height="22" rx="1" fill="#00D9FF">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.36;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="0" y="293" width="900" height="3" fill="url(#line)" opacity=".8"/>
  </g>
</svg>
